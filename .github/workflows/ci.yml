name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UEBulkExport.slnx

      - name: Build
        run: dotnet build UEBulkExport.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/UEBulkExport.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      # The native helper is lifted out of a downloaded NuGet package by the build. If that ever
      # breaks, animations silently stop exporting, so fail loudly here instead. Upstream only
      # publishes a Windows build of it, hence the condition. Both executables need their own copy.
      - name: Verify the native helper was fetched
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for project in UEBulkExport.Cli UEBulkExport; do
            if ! ls "src/$project/bin/Release/net10.0/CUE4Parse-Natives."* >/dev/null 2>&1; then
              echo "::error::CUE4Parse-Natives was not copied into the $project build output"
              exit 1
            fi
          done

      - name: Smoke test the CLI
        run: dotnet run --project src/UEBulkExport.Cli -c Release --no-build -- --version

      # The GUI executable accepts the same arguments and must answer without opening a window.
      - name: Smoke test the GUI executable in command-line mode
        run: dotnet run --project src/UEBulkExport -f net10.0 -c Release --no-build -- --version

  # Builds the real installer exactly as a release does (installer/build.ps1), then installs it
  # silently for the current user, runs the installed CLI and uninstalls it again. Catches an
  # installer script that compiles but breaks at install time before a release is tagged.
  installer:
    name: Installer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: powershell
        run: ./installer/install-inno.ps1

      - name: Build the installer
        id: build
        shell: powershell
        run: ./installer/build.ps1

      - name: Install, run and uninstall it
        shell: powershell
        run: ./installer/smoke-test.ps1 -Installer '${{ steps.build.outputs.installer }}'

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: UEBulkExport-setup-${{ github.sha }}
          path: |
            artifacts/installer/UEBulkExport-*-setup.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
