name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Code signing is optional: add these two repository secrets (a base64-encoded .pfx and its
    # password) and every executable, the installer and its uninstaller are signed. Without
    # them the release is built unsigned, exactly as before.
    env:
      SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      TIMESTAMP_URL: http://timestamp.digicert.com
    # Windows only, deliberately. Every piece a real export needs off the managed path -
    # the Oodle decompressor, the ACL native, vgmstream, retoc - is published by its upstream for
    # Windows alone, so a Linux binary would only disappoint. Linux still builds from source
    # and is covered by CI; see the README.
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        shell: powershell
        run: ./installer/install-inno.ps1

      - name: Prepare code signing
        if: env.SIGNING_CERTIFICATE != ''
        shell: powershell
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the runner.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SIGNTOOL_PATH=$($signtool.FullName)`nSIGNING_PFX=$pfx`n")

      # The same script as CI and local builds: publishes the window and the console program into
      # one folder, adds the offline documentation, generates the wizard artwork, signs the
      # executables, the installer and its uninstaller (with a certificate) and writes SHA256SUMS.txt.
      - name: Build the Windows installer
        id: build
        shell: powershell
        run: |
          $arguments = @{ Version = '${{ steps.version.outputs.value }}'; Runtime = '${{ matrix.rid }}' }
          if ($env:SIGNING_CERTIFICATE) {
            # Inno Setup's sign tool syntax: $q is a double quote, $f the file to sign.
            $arguments.SignCommand = "`$q$env:SIGNTOOL_PATH`$q sign /fd sha256 /tr $env:TIMESTAMP_URL /td sha256 " +
              "/f `$q$env:SIGNING_PFX`$q /p `$q$env:SIGNING_PASSWORD`$q `$f"
          }
          ./installer/build.ps1 @arguments

      # Nothing is attached unless the installer really installs, starts and uninstalls.
      - name: Install, run and uninstall it
        shell: powershell
        run: ./installer/smoke-test.ps1 -Installer '${{ steps.build.outputs.installer }}'

      - name: Remove the signing certificate
        if: always() && env.SIGNING_PFX != ''
        shell: powershell
        run: Remove-Item $env:SIGNING_PFX -Force -ErrorAction SilentlyContinue

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/installer/UEBulkExport-*-win-x64-setup.exe
            artifacts/installer/SHA256SUMS.txt
