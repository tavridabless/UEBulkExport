name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Windows only, deliberately. Every piece a real export needs off the managed path -
    # the Oodle decompressor, the ACL native, vgmstream, retoc - is published by its upstream for
    # Windows alone, so a Linux binary would only disappoint. Linux still builds from source
    # and is covered by CI; see the README.
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Both front ends land in one folder: UEBulkExport.exe (the window) and
      # UEBulkExport.Cli.exe (the console), sharing the same Core and native libraries.
      - name: Publish the GUI
        run: >
          dotnet publish src/UEBulkExport
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o staging/UEBulkExport

      - name: Publish the CLI
        run: >
          dotnet publish src/UEBulkExport.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o staging/UEBulkExport

      - name: Add the documentation people will need offline
        shell: bash
        run: |
          cp README.md README.ru.md LICENSE NOTICE THIRD-PARTY-NOTICES.md CHANGELOG.md staging/UEBulkExport/
          mkdir -p staging/UEBulkExport/docs
          cp docs/mappings.md docs/mappings.ru.md docs/screenshot.png staging/UEBulkExport/docs/
          cp -r docs/images staging/UEBulkExport/docs/
          cp -r tools staging/UEBulkExport/

      # The wizard images are derived from the designs in installer/branding; only the sources
      # are committed. The generator also refreshes the application icon, which the publish above
      # has already embedded, so running it here changes nothing that ships besides the wizard.
      - name: Generate installer artwork
        run: dotnet run --project installer/branding/generator -c Release -- installer/branding src/UEBulkExport/Assets docs/images

      - name: Install Inno Setup
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest `
            'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' `
            -OutFile $installer

          $expectedHash = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup checksum mismatch: $actualHash"
          }

          $process = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru `
            -ArgumentList @('/PORTABLE=1', '/VERYSILENT', '/CURRENTUSER', '/NORESTART', "/DIR=`"$installDir`"")
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          "ISCC_PATH=$(Join-Path $installDir 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Build the Windows installer
        shell: powershell
        run: |
          $source = (Resolve-Path 'staging\UEBulkExport').Path
          $output = Join-Path $PWD 'artifacts\installer'
          & $env:ISCC_PATH `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$source" `
            "/DOutputDir=$output" `
            'installer\UEBulkExport.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/installer/UEBulkExport-*-win-x64-setup.exe
